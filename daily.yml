name: Daily job search
on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 7am Sydney (AEDT). Adjust to taste.
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: job-agent
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      - name: Save seen jobs
        run: |
          git config user.name "job-agent"; git config user.email "job-agent@users.noreply.github.com"
          git add seen.json industry_cache.json && git commit -m "update seen jobs" && git push || echo "nothing to commit"
